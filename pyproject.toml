[project]
name = "holoclips"
version = "0.1.0"
description = "CLI para descubrir los clips más vistos de canales de Hololive Production y generar playlists reproducibles en MPV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (seguridad)
    "RUF", # ruff-specific
]
ignore = [
    "S603", # subprocess sin shell=True es seguro
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert en tests es lo esperado

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
